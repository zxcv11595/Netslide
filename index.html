      html, body { margin: 0; background: #fff9ee; }
      .loading {
        position: relative; isolation: isolate; overflow: hidden;
        height: 100vh; height: 100dvh; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; padding: max(24px, env(safe-area-inset-top)) 24px max(40px, env(safe-area-inset-bottom));
        color: #55301d;
        background:
          radial-gradient(ellipse at 50% 48%, #fff9ee 25%, #fff9ee00 75%),
          linear-gradient(180deg, var(--scene-sky) 0%, var(--scene-sky) 10%, #fff9ee 29%, #fff9ee 66%, var(--scene-soil) 88%, var(--scene-deep));
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      }
      .loading::before, .loading::after { content: ""; position: absolute; inset-inline: 0; z-index: -1; pointer-events: none; mask-size: 100% 100%; mask-repeat: no-repeat; }
      .loading::before { top: 3%; height: 210px; background: var(--scene-grass); mask-image: var(--scene-ridge); opacity: .85; }
      .loading::after { bottom: 0; height: 230px; background: var(--scene-mark); mask-image: var(--scene-details); opacity: .5; }
      .loading > * { flex-shrink: 0; }
      .loading .brand { position: relative; z-index: 2; text-align: center; }
      .loading h1 { margin: 0; position: relative; font-size: clamp(2.4rem, 13vw, 3.2rem); font-weight: 900; line-height: 1.1; letter-spacing: -.04em; }
      .loading h1::after { content: ""; position: absolute; left: 50%; margin-left: -90px; bottom: -16px; width: 180px; height: 11px; border-radius: 999px; background: #ee962b; transform: rotate(-3deg); }
      .loading .subtitle { margin: 33px 0 0; font-size: 14px; font-weight: 700; line-height: 1.4; letter-spacing: .07em; }
      .loading .character { position: relative; display: grid; place-items: center; width: min(62vw, 230px); aspect-ratio: 1312 / 1199; margin-top: 20px; }
      .loading .character img { display: block; position: relative; z-index: 1; width: 100%; height: auto; margin: 0; }
      .loading .orbit { position: absolute; pointer-events: none; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 145%; height: auto; z-index: 0; }
      .loading .delivery { position: relative; z-index: 2; display: block; width: min(78vw, 280px); height: auto; }
      .loading .fill { stroke-dasharray: 210; stroke-dashoffset: 210; animation: fill-grow 2.3s ease-in-out infinite; }
      .loading .ham-run { animation: ham-run 2.3s ease-in-out infinite; }
      .loading .ham-body { transform-box: fill-box; transform-origin: center; animation: ham-pop 2.3s ease-in-out infinite; }
      .loading .seed-end { animation: seed-found 2.3s linear infinite; }
      .loading .ham-idle { animation: ham-idle 2.3s linear infinite; }
      .loading .ham-happy { opacity: 0; animation: ham-happy 2.3s linear infinite; }
      .loading .twinkle { animation: twinkle 1.25s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .loading .twinkle.late { animation-delay: -.6s; }
      /* 햄스터가 나무 길을 따라 도토리를 찾아간다. 지나온 길은 연한 색에서 주황으로 진해지며 끝까지 찬다.
         도토리에 닿으면 햄스터가 통 튀며 도토리를 든 기쁜 얼굴로 바뀌고, 잠시 뒤 처음 자리로 돌아간다. */
      @keyframes ham-run { 0%,5% { transform: translateX(0); opacity: 1; } 50%,93% { transform: translateX(210px); opacity: 1; } 94% { transform: translateX(210px); opacity: 0; } 95% { transform: translateX(0); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
      @keyframes seed-found { 0%,47% { opacity: 1; } 50%,95% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes fill-grow { 0%,5% { stroke-dashoffset: 210; stroke: #fff3dc; } 50%,93% { stroke-dashoffset: 0; stroke: #ee962b; } 94%,100% { stroke-dashoffset: 210; stroke: #fff3dc; } }
      @keyframes ham-pop { 0%,48% { transform: scale(1); } 56% { transform: scale(1.16); } 64% { transform: scale(0.97); } 70%,100% { transform: scale(1); } }
      @keyframes ham-idle { 0%,49% { opacity: 1; } 52%,93% { opacity: 0; } 95%,100% { opacity: 1; } }
      @keyframes ham-happy { 0%,49% { opacity: 0; } 52%,93% { opacity: 1; } 95%,100% { opacity: 0; } }
      .boot-error { position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); width: min(86vw, 340px); padding: 14px 18px; text-align: center; background: #fff9ee; color: #55301d; border: 2px solid #55301d; border-radius: 20px; box-shadow: 0 5px 0 #e1c59e; z-index: 5; }
      .boot-error b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
      .boot-error p { margin: 0; font-size: .88rem; line-height: 1.5; }
      .boot-error small { display: block; margin-top: 6px; font-size: .7rem; opacity: .6; word-break: break-all; }
      @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
      /* 게이지는 도토리 동그라미와 같은 박자로 차오른다. 게이지 전체 색이 아주 연한 색에서 시작해 햄스터에 가까워질수록 주황으로 진해진다 */
      @media (max-height: 700px) { .loading { gap: 15px; padding-top: 20px; padding-bottom: 24px; } .loading .character { width: 190px; margin-top: 4px; } .loading .delivery { width: 260px; } .loading::before { height: 170px; } .loading::after { height: 180px; } }
      @media (prefers-reduced-motion: reduce) { .loading *, .loading::before, .loading::after { animation: none !important; } .loading .ham-run { transform: none; opacity: 1; } .loading .seed-end { opacity: 1; } .loading .fill { stroke-dashoffset: 0; } .loading .twinkle { opacity: .8; } }

:root:is([data-scene="wash"], [data-scene="pattern"], [data-scene="garden"]) .loading {
  --scene-paper: #fff9ee;
  --scene-edge-strength: 100%;
  --scene-art-opacity: .85;
  background-color: var(--scene-paper);
  background-image: linear-gradient(180deg,
    color-mix(in srgb, #dcebed var(--scene-edge-strength), var(--scene-paper)) 0%,
    var(--scene-paper) 34%, var(--scene-paper) 65%,
    color-mix(in srgb, #efcfab var(--scene-edge-strength), var(--scene-paper)) 100%);
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}
:root:is([data-scene="wash"], [data-scene="pattern"], [data-scene="garden"]) .loading::before, :root:is([data-scene="wash"], [data-scene="pattern"], [data-scene="garden"]) .loading::after {
  mask: none;
  background: none;
  opacity: var(--scene-art-opacity);
}
:root:is([data-scene="wash"], [data-scene="pattern"], [data-scene="garden"]) .loading::before {
  top: 0; bottom: auto; height: 180px;
}
:root:is([data-scene="wash"], [data-scene="pattern"], [data-scene="garden"]) .loading::after {
  top: auto; bottom: 0;
  height: 180px;
}
:root[data-scene="wash"] .loading::before { background-image: radial-gradient(ellipse at 12% 0%, #bcdde6 0%, #bcdde600 70%); }
:root[data-scene="wash"] .loading::after { background-image: radial-gradient(ellipse at 95% 100%, #e9bd94 0%, #e9bd9400 72%); }

      /* 타이틀: 글꼴(주아, 필요한 글자만 담은 파일), 다 불러오면 게이지가 가득 차고 "화면을 눌러 시작"이 나온다 */
      .loading .ver { position: absolute; right: 14px; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 12px; font-weight: 700; letter-spacing: .02em; color: #8c7555; opacity: .85; }
      @font-face { font-family: "Jua"; src: url("assets/fonts/jua-subset.woff2") format("woff2"); font-display: swap; }
      /* 본문 글꼴: 기기에 Pretendard가 없으면 기기마다 다른 글꼴로 보여서(숫자와 한글 모양이 따로 놂) 게임에 함께 싣는다.
         게임에 나오는 글자만 담았다. 새 글자를 쓰면 python tools/make-fonts.py 로 다시 만든다. */
      @font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/pretendard-500.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/pretendard-700.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/pretendard-800.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/pretendard-900.woff2") format("woff2"); font-display: swap; }
      .loading h1, .loading .subtitle, .loading .tap-cta { font-family: "Jua", "Pretendard", "Malgun Gothic", system-ui, sans-serif; font-weight: 400; }
      .loading h1 { letter-spacing: .01em; }
      .loading .subtitle { font-size: 15px; letter-spacing: .06em; }
      .loading .tap-wrap { position: absolute; left: 0; right: 0; bottom: max(64px, 11vh); display: flex; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 260ms; }
      .loading .tap-cta { font-size: 2.2rem; letter-spacing: .03em; color: #55301d; }
      .loading.done { cursor: pointer; }
      .loading.done .tap-wrap { opacity: 1; }
      .loading.done .tap-cta { animation: tap-blink 1.5s ease-in-out infinite; }
      @keyframes tap-blink { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
      .loading.done .fill { animation: none; stroke-dashoffset: 0; stroke: #ee962b; }
      .loading.done .ham-run { animation: none; transform: translateX(210px); opacity: 1; }
      .loading.done .ham-body, .loading.done .seed-end, .loading.done .ham-idle, .loading.done .ham-happy { animation: none; }
      .loading.done .seed-end, .loading.done .ham-idle { opacity: 0; }
      .loading.done .ham-happy { opacity: 1; }
      .loading.done .character img { animation: hero-cheer 1.1s ease-in-out infinite; transform-origin: 50% 90%; }
      @keyframes hero-cheer { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-16px) scale(1.06); } 55% { transform: translateY(0) scale(.97); } 75% { transform: translateY(-5px) scale(1.01); } }
      @media (prefers-reduced-motion: reduce) { .loading.done .tap-cta, .loading.done .character img { animation: none; } }

      /* 타이틀 배치(2026-11-11): 로고 · 햄스터 · 게이지 · 시작 글자를 한 줄기로 쌓고, 크기와 간격을 화면 높이에 맞춘다.
         시작 글자는 다 불러오기 전에도 자리를 차지해서 나타날 때 화면이 움직이지 않는다. 최대값이 844px 높이 폰 기준이다. */
      .loading { gap: clamp(10px, 2.6dvh, 22px); padding: max(16px, env(safe-area-inset-top)) 24px max(16px, env(safe-area-inset-bottom)); }
      .loading h1 { font-size: min(13vw, clamp(2.1rem, 6.1dvh, 3.2rem)); }
      .loading .subtitle { margin-top: clamp(24px, 3.9dvh, 33px); font-size: clamp(13px, 1.8dvh, 15px); }
      .loading .character { width: min(62vw, clamp(140px, 27.2dvh, 230px)); margin-top: clamp(8px, 2.4dvh, 20px); }
      .loading .delivery { width: min(78vw, clamp(210px, 33.2dvh, 280px)); margin-top: clamp(2px, 1.2dvh, 10px); }
      .loading .tap-wrap { position: static; margin-top: clamp(2px, 1.6dvh, 14px); }
      .loading .tap-cta { font-size: min(9.4vw, clamp(1.45rem, 4.2dvh, 2.2rem)); line-height: 1.2; }
      .loading::before { height: clamp(150px, 24.9dvh, 210px); }
      .loading::after { height: clamp(160px, 27.3dvh, 230px); }
      /* 게이지 끝의 햄스터 그림이 동그라미 밖으로 네모나게 삐져나오지 않게 둥글게 자른다 */
      .loading .ham-body svg { clip-path: circle(49%); }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="loading" role="status" aria-label="불러오는 중">
        <header class="brand"><h1>Nutslide</h1><p class="subtitle">슬라이드 퍼즐 게임</p></header>
        <div class="character"><svg class="decor orbit" viewBox="0 0 340 300" aria-hidden="true"><ellipse cx="170" cy="156" rx="146" ry="112" fill="#fff1d8"/><ellipse cx="170" cy="156" rx="157" ry="124" fill="none" stroke="#e1c59e" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"/>
<g class="twinkle" fill="#ee962b"><path d="M44 78L47 89L58 92L47 95L44 106L41 95L30 92L41 89Z"/><path d="M290 176L293 185L302 188L293 191L290 200L287 191L278 188L287 185Z"/></g><g class="twinkle late" fill="#ee962b"><path d="M278 62L281 70L289 73L281 76L278 84L275 76L267 73L275 70Z"/><circle cx="63" cy="222" r="3"/><circle cx="310" cy="124" r="3"/></g></svg><img src="assets/hamster-idle.webp" alt="" /></div>
        <svg class="delivery" viewBox="0 0 300 90" aria-hidden="true">
          <path d="M45 45H255" stroke="#55301d" stroke-width="34" stroke-linecap="round" />
          <path d="M45 45H255" stroke="#f4e0bd" stroke-width="25" stroke-linecap="round" />
          <path class="fill" d="M45 45H255" stroke="#ee962b" stroke-width="25" stroke-linecap="round" />
          <g class="seed-end">
            <circle cx="255" cy="45" r="38" fill="#55301d" /><circle cx="255" cy="45" r="33.5" fill="#fff1d8" />
            <image href="assets/acorn.webp" x="232" y="22" width="46" height="46" />
          </g>
          <g class="ham-run">
            <g class="ham-body">
              <circle cx="45" cy="45" r="38" fill="#55301d" /><circle cx="45" cy="45" r="33.5" fill="#fff9ee" />
              <svg x="11" y="9" width="68" height="68" viewBox="118 28 420 420">
                <image class="ham-idle" href="assets/hamster-idle.webp" width="656" height="600" />
                <image class="ham-happy" href="assets/hamster-success.webp" width="656" height="600" />
              </svg>
            </g>
          </g>
        </svg>
        <div class="tap-wrap" aria-hidden="true"><div class="tap-cta">화면을 눌러 시작</div></div>
        <span class="ver" aria-hidden="true">v1.0.0</span>
      </div>
    </main>
    <noscript>이 게임은 자바스크립트가 필요해요. / This game needs JavaScript.</noscript>
    <script>
      // 언어: 저장한 값(nutslide-lang)이 있으면 그것, 없으면 기기 언어. 게임 코드가 오기 전에 타이틀 글자부터 맞춘다(src/i18n.js와 같은 규칙)
      (function () {
        var l = null;
        try { l = localStorage.getItem('nutslide-lang'); } catch (e) {}
        if (l !== 'ko' && l !== 'en') l = /^ko\b/i.test(navigator.language || '') ? 'ko' : 'en';
        document.documentElement.lang = l;
        if (l !== 'en') return;
        document.title = 'Nutslide: Hamster Slide Puzzle';
        document.querySelector('.loading').setAttribute('aria-label', 'Loading');
        document.querySelector('.loading .subtitle').textContent = 'Slide puzzle game';
        document.querySelector('.loading .tap-cta').textContent = 'Tap to start';
      })();
      // 게임 코드를 불러오지 못하면(광고 차단, 통신 문제 등) 로딩 화면에서 멈추지 않고 이유를 알려 준다
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (!t || t.tagName !== 'SCRIPT') return;
        var app = document.getElementById('app');
        if (!app || app.querySelector('.screen') || app.querySelector('.boot-error')) return;
        var box = document.createElement('div');
        box.className = 'boot-error';
        box.innerHTML = document.documentElement.lang === 'en'
          ? '<b>The game could not start</b><p>If you use an ad blocker, please turn it off for this site. If that does not help, reload the page.</p>'
          : '<b>게임을 열지 못했어요</b><p>광고 차단 프로그램을 쓰고 있다면 이 사이트에서 잠시 꺼 주세요. 그래도 안 되면 새로 고쳐 주세요.</p>';
        (app.querySelector('.loading') || app).appendChild(box);
      }, true);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
